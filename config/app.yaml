# Safe default: a complete Sprite2D desktop with no keys or audio downloads.
schema_version: 2

app:
  log_level: INFO
  log_format: text

llm:
  active_backend: ollama
  history_turns: 10
  backends:
    # Phase 3: qwen3:14b (Q4, ~9.7 GB) fits beside Whisper on the 12 GB GPU
    # once bge-m3 runs on the CPU (memory.embedding_device: cpu).
    # Memory extraction and summaries use this same backend, so only one
    # chat model is ever loaded.
    ollama:
      adapter: litellm
      provider: ollama
      model: ollama_chat/qwen3:14b
      api_base: "http://127.0.0.1:11434"
      api_key_env: null
      temperature: 0.6
      request_timeout_s: 180
      keep_alive: 60m
      fallback_backend: ollama-8b
    # Fallback when 14b cannot load or errors; also selectable in the dashboard.
    ollama-8b:
      adapter: litellm
      provider: ollama
      model: ollama_chat/qwen3:8b
      api_base: "http://127.0.0.1:11434"
      api_key_env: null
      temperature: 0.6
      request_timeout_s: 180
      keep_alive: 10m

voice:
  stt:
    # Hold Ctrl+Space to talk. Faster-Whisper runs in an isolated worker;
    # "yue" asks Whisper large-v3 for Hong Kong Cantonese transcription.
    adapter: isolated-faster-whisper
    model: large-v3-turbo
    language: yue
    device: auto
    compute_type: auto
    beam_size: 5
    prompt: "喺度、唔係、咗、嘅、啲、佢哋、聽日、傾偈、攰"
    post_speech_silence_duration: 1.0
    wake:
      enabled: false
  tts:
    adapter: azure-qwen3-fallback
    voice: zh-HK-HiuMaanNeural
    endpoint: https://australiaeast.tts.speech.microsoft.com/cognitiveservices/v1
    readiness_timeout_s: 120
  modes:
    text_always_on: true
    continuous_listening: false
    live_wake: false
    agent_voice: true
    barge_in_enabled: false

interaction:
  response_presentation:
    mode: parallel
    dismiss_policy: after_both
    minimum_ms: 2500
    base_ms: 1500
    ms_per_character: 55
    maximum_ms: 30000
    allow_accessibility_captions: true

# Memory is deliberately opt-in. Enabling it changes data retention behavior.
memory:
  enabled: false
  provider: none

# The default dependency set is suitable for later commercial distribution.
distribution:
  profile: commercial

avatar:
  runtime: sprite2d
  pack: ai_girlfriend
  pack_roots:
    - ./characters
  runtimes:
    sprite2d:
      pack_path: ./characters/ai_girlfriend

tasks:
  default_runtime: mock
  runtimes:
    mock:
      adapter: mock


