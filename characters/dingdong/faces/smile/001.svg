  <rect x="92" y="102" width="216" height="156" rx="72" fill="url(#visor)" stroke="#0A121C" stroke-width="4"/>
  <path d="M120 128 Q150 110 196 110" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.16"/>
  <circle cx="284" cy="132" r="5" fill="#FFFFFF" opacity="0.18"/><path d="M144 184 Q160 164 176 184" fill="none" stroke="#6FF2FF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/><path d="M224 184 Q240 164 256 184" fill="none" stroke="#6FF2FF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/><path d="M184 220 L216 220 Q216 236 200 238 Q184 236 184 220 Z" fill="#6FF2FF" filter="url(#glow)"/><ellipse cx="130" cy="214" rx="15" ry="8" fill="#FF9BB3" opacity="0.4" filter="url(#soft)"/><ellipse cx="270" cy="214" rx="15" ry="8" fill="#FF9BB3" opacity="0.4" filter="url(#soft)"/></svg>
