# 叮當 — original screen-face robot, generated by scripts/make_dingdong_svg.py.
# faces/<expression>/000.svg = resting mouth, 001-003 = speaking mouths;
# faces/blink.svg and faces/smile_blink.svg = blink frames. The frontend
# (DingdongAvatar.tsx) picks frames itself; this manifest just makes the
# backend serve the folder under /static/characters/dingdong/.

schema_version: 1
id: dingdong
name: 叮當
author: local
license: personal-use
kind: sprite2d
preview: faces/neutral/000.svg
default_state: idle
default_emotion: neutral
transition_ms: 120

emotions:
  idle:
    frames: [faces/neutral/000.svg, faces/blink.svg]
    speaking_frames: [faces/neutral/000.svg, faces/neutral/001.svg, faces/neutral/002.svg, faces/neutral/003.svg]
    fps: 1
    loop: true
  happy:
    frames: [faces/happy/000.svg]
    speaking_frames: [faces/happy/000.svg, faces/happy/001.svg, faces/happy/002.svg, faces/happy/003.svg]
    fps: 1
    loop: true
  thinking:
    frames: [faces/thinking/000.svg]
    speaking_frames: [faces/thinking/000.svg]
    fps: 1
    loop: true
